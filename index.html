<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Alquerque</title>
    <!-- carregar fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="titulo">Alquerque</h1>

        <form class="login">
            <input type="text" placeholder="Utilizador">
            <input type="password" placeholder="Password">
            <button type="submit">Entrar</button>
        </form>

        <button class="hamburguer" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <nav class="menu" id="menu">
        <ul>
            <li>Regras
            <p>testetestetestetestetestetestetestetestetestetestetestetestetestetestetestetestetesteteste</p>
            </li>
            <li>Classificações
                <table class="ranking">
                    <thead>
                        <tr><th>Jogador</th><th>V</th><th>D</th><th>E</th></tr>
                    </thead>
                    <tbody id="tabela-ranking"></tbody>
                </table>
            </li>
        </ul>
    </nav>

    <main>
        <div class="opcoes">
            <fieldset>
                <legend>Adversário</legend>
                <label><input type="radio" name="adversario" value="humano" checked> Humano</label>
                <label><input type="radio" name="adversario" value="ia"> IA</label>
            </fieldset>

            <fieldset>
                <legend>Dificuldade</legend>
                <label><input type="radio" name="dificuldade" value="facil" checked> Fácil</label>
                <label><input type="radio" name="dificuldade" value="medio"> Médio</label>
                <label><input type="radio" name="dificuldade" value="dificil"> Difícil</label>
            </fieldset>

            <fieldset>
                <legend>Começam</legend>
                <label><input type="radio" name="comeca" value="brancas" checked> Brancas</label>
                <label><input type="radio" name="comeca" value="pretas"> Pretas</label>
            </fieldset>
        </div>

        <div class="controlo">
            <button id="novo-jogo">Novo jogo</button>
            <button id="desistir">Desistir</button>
            <button id="empate">Propor empate</button>
            <p id="estado"></p>

            <div id="pergunta-empate" hidden>
                <p id="texto-empate"></p>
                <button id="aceitar-empate">Aceitar</button>
                <button id="recusar-empate">Recusar</button>
            </div>
        </div>

        <div class="tabuleiro">
            <svg viewBox="0 0 400 400"></svg>
        </div>
    </main>
    <script src="ia.js"></script>
    <script src="script.js"></script>
</body>
</html>
